<style>
    .musicSwiper .swiper-pagination {
        bottom: 5px !important;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
    }

    .musicSwiper .swiper-pagination-bullet {
        width: 7px;
        height: 7px;
        margin: 0 !important;
        opacity: 1;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        transition:
            width 0.35s ease,
            background 0.35s ease,
            transform 0.35s ease,
            opacity 0.35s ease;
    }

    .musicSwiper .swiper-pagination-bullet:hover {
        transform: scale(1.25);
        background: rgba(255, 255, 255, 0.5);
    }

    .musicSwiper .swiper-pagination-bullet-active {
        width: 28px;
        background: rgb(167, 139, 250);
        box-shadow: 0 0 18px rgba(139, 92, 246, 0.5);
    }

    .musicSwiper .swiper-slide {
        height: auto;
    }

    .musicSwiper .swiper-slide > div {
        height: 100%;
    }

    @media (max-width: 767px) {
        .musicSwiper {
            padding-bottom: 48px !important;
        }

        .musicSwiper .swiper-pagination {
            bottom: 2px !important;
        }

        .musicSwiper .swiper-pagination-bullet {
            width: 6px;
            height: 6px;
        }

        .musicSwiper .swiper-pagination-bullet-active {
            width: 22px;
        }
    }

    @media (min-width: 768px) and (max-width: 1279px) {
        .musicSwiper .swiper-slide > div {
            min-height: 390px;
        }
    }

    @media (min-width: 1280px) {
        .musicSwiper .swiper-slide > div {
            min-height: 430px;
        }
    }
</style>
